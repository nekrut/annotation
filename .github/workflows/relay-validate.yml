name: relay-validate

# Automatic runs are off: the coordinator closed the relay on 2026-11-10
# (see relay/STOP.md). To turn them back on, replace `on:` below with the
# original triggers:
#
# on:
#   push:
#     paths: ["relay/**"]
#   pull_request:
#     paths: ["relay/**"]
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 relay/bin/relay.py validate
      - run: python3 relay/bin/relay.py status
