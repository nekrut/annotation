name: relay-validate

on:
  push:
    paths: ["relay/**"]
  pull_request:
    paths: ["relay/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 relay/bin/relay.py validate
      - run: python3 relay/bin/relay.py status
