[project]
name = "annotation"
version = "0.0.1"
description = "Fast, geometric eukaryotic gene prediction: benchmark, baselines and the Phase 4 prototype"
requires-python = ">=3.11"
# The grammar package (model/grammar) and its tests use the standard library
# only, so the specification oracle runs anywhere. Model code adds torch.
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.2", "numpy>=1.26"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["model", "model.grammar", "model.a"]
